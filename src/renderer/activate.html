<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MediCare POS - Terminal Activation</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #06141B;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #CCD0CF;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
    }

    .activation-card {
      background: #11212D;
      padding: 40px;
      border-radius: 20px;
      width: 450px;
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.6);
      border: 1px solid #253745;
      text-align: center;
    }

    .activation-icon-badge {
      width: 52px;
      height: 52px;
      margin: 0 auto 18px auto;
      background: #38bdf8;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(56, 189, 248, 0.3);
    }

    .activation-card h2 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.015em;
      margin-bottom: 8px;
      color: #CCD0CF;
    }

    .activation-card p {
      font-size: 13px;
      color: #9BA8AB;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .hw-container {
      text-align: left;
      margin-bottom: 18px;
    }

    .hw-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9BA8AB;
      margin-bottom: 6px;
      display: block;
    }

    .hw-box {
      background: #0c1a24;
      border: 1px solid #4A5C6A;
      padding: 11px 14px;
      border-radius: 10px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 12px;
      word-break: break-all;
      color: #38bdf8;
      font-weight: 600;
      user-select: all;
      cursor: text;
    }

    .form-group-act {
      text-align: left;
      margin-bottom: 22px;
    }

    .form-group-act label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9BA8AB;
      margin-bottom: 6px;
      display: block;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      background: #0c1a24;
      border: 1px solid #4A5C6A;
      color: #CCD0CF;
      border-radius: 10px;
      font-size: 13.5px;
      text-align: center;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      outline: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-sizing: border-box;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .btn-activate {
      width: 100%;
      background: #10b981;
      color: #ffffff;
      border: none;
      padding: 13px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.25);
    }

    .btn-activate:hover {
      background: #059669;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
      transform: translateY(-1px);
    }

    .btn-activate:active {
      transform: scale(0.985);
    }

    #activation-msg {
      margin-top: 14px;
      font-size: 12.5px;
      font-weight: 600;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="activation-card">
    <div class="activation-icon-badge">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#06141B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>

    <h2>MediCare POS Activation</h2>
    <p>Please share your terminal Hardware ID with your vendor to receive your software activation key.</p>

    <div class="hw-container">
      <span class="hw-label">Terminal Hardware ID</span>
      <div id="hw-id-display" class="hw-box">Generating identifier...</div>
    </div>

    <div class="form-group-act">
      <label for="license_key_input">Paste License Key *</label>
      <input type="text" id="license_key_input" placeholder="Paste license key here..." autocomplete="off" autofocus />
    </div>

    <button id="activate-btn" class="btn-activate">Verify & Activate License</button>
    <div id="activation-msg"></div>
  </div>

  <script>
    async function init() {
      const hwId = await window.api.getHardwareId();
      document.getElementById('hw-id-display').innerText = hwId;
    }
    init();

    document.getElementById('activate-btn').addEventListener('click', async () => {
      const key = document.getElementById('license_key_input').value.trim();
      const msg = document.getElementById('activation-msg');

      if (!key) {
        msg.style.color = '#ef4444';
        msg.innerText = 'Please enter an authorized license key.';
        return;
      }

      msg.style.color = '#9BA8AB';
      msg.innerText = 'Validating license credentials...';

      const res = await window.api.activateLicense(key);
      if (res && res.success) {
        msg.style.color = '#10b981';
        msg.innerText = '✓ Terminal activated successfully! Launching...';
        setTimeout(() => {
          window.location.reload();
        }, 1200);
      } else {
        msg.style.color = '#ef4444';
        msg.innerText = '✗ ' + (res?.error || 'License activation failed.');
      }
    });
  </script>
</body>
</html>
